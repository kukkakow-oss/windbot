# Builds WindBot (with the Bot Theater pause option) on GitHub's computers.
# Runs automatically after every change, or by hand from the Actions tab.
# The result is a download called "WindBot" on the run's page.
name: Build WindBot

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Solution_Name: WindBot.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Build!
      run: msbuild $env:Solution_Name /t:Build /p:Configuration=Release

    - name: Pack
      run: |
        mkdir dist
        xcopy /e /y bin\Release dist\WindBot\

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: WindBot
        path: dist
